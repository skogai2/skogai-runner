[tools]
argc = "latest"
usage = "latest"
jq = "latest"
yq = "latest"
bats = "latest"

[tasks.image]
description = "build the podman image modules run in (skipped without podman)"
run = "command -v podman >/dev/null || { echo 'podman not on PATH: image not built' >&2; exit 0; }; podman build -q -t skogai-runner-dev -f Containerfile ."

[tasks.test]
description = "bats tests on this machine"
depends = ["image"]
run = "bats tests"

[tasks."test:usage"]
description = "the contract and run tests against the usage twins of contract/argc.sh and run/argc.sh"
depends = ["image"]
run = "CONTRACT_IMPL=usage RUN_IMPL=usage bats tests/contract.bats tests/run.bats"

[tasks."test:container"]
description = "bats tests in a clean arch container"
depends = ["image"]
run = "podman run --rm -v {{config_root}}:/repo:ro skogai-runner-dev bats /repo/tests"
