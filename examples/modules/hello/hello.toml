[env]
SKOGAI_HELLO_GREETING = "{{ env.SKOGAI_HELLO_GREETING | default(value='hi') }}"

[_.skogai.hello]
description = "greet someone and keep the greeting in greeting.txt"
owns = ["greeting.txt"]
writes = ["greeting.txt"]

[tasks.hello]
usage = 'arg "<who>"'
run = 'echo "$SKOGAI_HELLO_GREETING $usage_who" | tee greeting.txt'
