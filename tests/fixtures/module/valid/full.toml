[env]
SKOGAI_FULL_GREETING = "{{ get_env(name='SKOGAI_FULL_GREETING', default='hi') }}"
SKOGAI_FULL_OTHER = "x"

[_.skogai.full]
description = "every allowed key"
depends_on = []
reads = ["in.txt"]
writes = ["out.txt"]
owns = ["out.txt", "more/"]
watches = ["events/"]

[tasks.full]
usage = 'arg "<who>"'
run = ['echo one', 'echo two']
